services:
  # Startas uttryckligen på dev-servern; ingår inte i standardstarten.
  dev_http:
    image: traefik
    profiles: [dev-http]
    environment:
      DEV_MODE: ${DEV_MODE:-false}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${DEV_MODE}" != "true" ]; then
          echo "HTTP-proxyn kräver DEV_MODE=true." >&2
          exit 1
        fi
        exec traefik --entrypoints.web.address=:80 --providers.file.filename=/etc/traefik/dev-http.yml
    ports:
      - "${DEV_HTTP_BIND_IP:-127.0.0.1}:80:80"
    volumes:
      - ./deploy/traefik/dev-http.yml:/etc/traefik/dev-http.yml:ro
    networks:
      - public_net
    restart: unless-stopped

  fail2ban:
    image: crazymax/fail2ban
    environment:
      TZ: ${TZ:-Europe/Stockholm}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - ./deploy/fail2ban/jail.local:/data/jail.d/jail.local:ro
      - ./deploy/fail2ban/fail2ban.local:/etc/fail2ban/fail2ban.local:ro
      # Skapas på servern före start; innehåller tillåten administratörsadress och SSH-port.
      - type: bind
        source: ./deploy/fail2ban/ssh-access.local
        target: /data/jail.d/zz-ssh-access.local
        read_only: true
        bind:
          create_host_path: false
      - /var/log:/var/log/host:ro
      - fail2ban_data:/data/db
    healthcheck:
      test: ["CMD", "fail2ban-client", "status", "sshd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
      DATABASE_URL: postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      THREADS: ${THREADS:-4}
    expose:
      - "80"
    volumes:
      - env_data:/config
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      public_net:
        aliases:
          - utbildningsintyg-web
      db_net:
    restart: unless-stopped

  expiry_reminder:
    build: .
    command: ["python", "-m", "scripts.send_expiry_reminders"]
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
      DATABASE_URL: postgresql://${POSTGRES_USER:-}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-}
    volumes:
      - env_data:/config
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public_net
      - db_net
    restart: "no"

  vscode:
    image: codercom/code-server:latest
    profiles:
      - "true"
      - "TRUE"
      - "True"
      - "1"
      - "yes"
      - "YES"
      - "on"
      - "ON"
    env_file:
      - .env
    environment:
      DEV_MODE: ${DEV_MODE:-false}
      PASSWORD: ${VSCODE_PASSWORD:-}
      TZ: ${TZ:-Europe/Stockholm}
    working_dir: /workspace
    ports:
      - "${VSCODE_BIND_IP:-127.0.0.1}:8087:8080"
    volumes:
      - .:/workspace
    networks:
      - public_net
    restart: "no"

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Publik exponering kräver POSTGRES_BIND_IP=0.0.0.0 (default är endast lokal åtkomst).
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PUBLIC_PORT:-1543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-} -d ${POSTGRES_DB:-} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - pg_pub_net
      - db_net
    restart: unless-stopped

  postgres_backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - pgdata_backups:/backups
      - ./scripts/backup:/scripts:ro
    command: ["bash", "/scripts/postgres_backup.sh", "--loop"]
    networks:
      - db_net
    restart: unless-stopped

volumes:
  env_data:
  app_logs:
    name: jk-utbildnings-intyg_app_logs
  demo_logs:
    name: jk-utbildnings-intyg_demo_logs
  status_logs:
    name: jk-utbildnings-intyg_status_logs
  fail2ban_data:
  pgdata:
    name: jk-utbildnings-intyg_pgdata
  pgdata_backups:
    name: jk-utbildnings-intyg_pgdata_backups
networks:
  public_net:
    external: true
    name: jk_public_net
  pg_pub_net: {}
  db_net:
    internal: true

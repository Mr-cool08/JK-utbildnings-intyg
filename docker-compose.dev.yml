name: jk-utbildnings-intyg-dev

services:
  app_dev:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEV_MODE: ${DEV_MODE:-true}
      DISABLE_EMAILS: ${DISABLE_EMAILS:-true}
      SECRET_KEY: ${SECRET_KEY:-}
      HASH_SALT: ${HASH_SALT:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      LOG_DIR: /app/logs
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/dev-data/dev.sqlite}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_PRIVATE_USER_NAME: ${DEV_PRIVATE_USER_NAME:-}
      DEV_PRIVATE_USER_EMAIL: ${DEV_PRIVATE_USER_EMAIL:-}
      DEV_PRIVATE_USER_PERSONNUMMER: ${DEV_PRIVATE_USER_PERSONNUMMER:-}
      DEV_PRIVATE_USER_PASSWORD: ${DEV_PRIVATE_USER_PASSWORD:-}
      DEV_COMPANY_NAME: ${DEV_COMPANY_NAME:-}
      DEV_COMPANY_EMAIL: ${DEV_COMPANY_EMAIL:-}
      DEV_COMPANY_ORGNR: ${DEV_COMPANY_ORGNR:-}
      DEV_COMPANY_PASSWORD: ${DEV_COMPANY_PASSWORD:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-jk_dev_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-https}
      DEV_UI_LABEL: ${DEV_UI_LABEL:-Utvecklingsmiljö}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      THREADS: ${THREADS:-4}
    expose:
      - "80"
    volumes:
      - dev_db:/app/dev-data
      - dev_logs:/app/logs
    networks:
      - public_net
      - dev_private_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PUBLIC_NETWORK_NAME:-jk_public_net}
      - traefik.http.routers.app-dev.rule=Host(`dev.utbildningsintyg.se`)
      - traefik.http.routers.app-dev.entrypoints=websecure
      - traefik.http.routers.app-dev.tls=true
      - traefik.http.routers.app-dev.middlewares=security-headers@file,upload-buffer@file
      - traefik.http.services.app-dev.loadbalancer.server.port=80
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.45"
    pids_limit: 200

volumes:
  dev_db:
    name: jk-utbildnings-intyg-dev_dev_db
  dev_logs:
    name: jk-utbildnings-intyg-dev_logs

networks:
  public_net:
    external: true
    name: ${PUBLIC_NETWORK_NAME:-jk_public_net}
  dev_private_net:
    internal: true

